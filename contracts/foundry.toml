[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"          # Portaldot V3 PolkaVM targets pre-PUSH0 opcodes; paris is safest
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
portaldot_testnet = "https://test-evm-rpc-v3.portaldot.dev"

[fmt]
line_length = 100
tab_width = 4
