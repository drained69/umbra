[package]
name = "umbra_coprocessor"
version = "0.1.0"
authors = ["Umbra"]
edition = "2021"
publish = false

[dependencies]
ink = { version = "5.0.0", default-features = false }

# arkworks: BN254 Groth16 verification, no_std so it compiles to the WASM VM target.
ark-bn254 = { version = "0.4.0", default-features = false, features = ["curve"] }
ark-groth16 = { version = "0.4.0", default-features = false }
ark-ec = { version = "0.4.0", default-features = false }
ark-ff = { version = "0.4.0", default-features = false }
ark-serialize = { version = "0.4.0", default-features = false }
ark-relations = { version = "0.4.0", default-features = false }

[lib]
path = "lib.rs"

[features]
default = ["std"]
std = [
    "ink/std",
    "ark-bn254/std",
    "ark-groth16/std",
    "ark-ec/std",
    "ark-ff/std",
    "ark-serialize/std",
    "ark-relations/std",
]
ink-as-dependency = []

# Build: `cargo contract build --release` (needs cargo-contract + the ink! toolchain).
# Produces target/ink/umbra_coprocessor.contract for deployment to pallet-contracts
# on Portaldot V3 via https://node-console.portaldot.dev/ or the relayer.
