name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        working-directory: contracts
        run: forge install foundry-rs/forge-std@v1.17.0 --no-git
      - name: Build (with size check)
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: forge test -vv

  zk-artifacts:
    name: ZK artifacts pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Proving keys + verifiers match MANIFEST.json
        run: node circuits/scripts/manifest.js --check

  sdk-frontend:
    name: SDK + Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: sdk
      - run: npx tsc --noEmit
        working-directory: sdk
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  coprocessor:
    name: WASM coprocessor (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: coprocessor
      - name: Verify real proofs natively (same fixtures as Solidity)
        working-directory: coprocessor
        run: cargo test -p umbra_groth16
      - name: no_std build for wasm32
        working-directory: coprocessor
        run: cargo build -p umbra_groth16 --no-default-features --target wasm32-unknown-unknown --release
      - name: ink! contract type-check
        working-directory: coprocessor
        run: cargo check -p umbra_coprocessor

  e2e:
    name: End-to-end (Anvil + real deploy + relayer)
    runs-on: ubuntu-latest
    needs: [contracts, zk-artifacts]
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: |
          (cd contracts && forge install foundry-rs/forge-std@v1.17.0 --no-git)
          (cd sdk && npm ci)
          (cd scripts && npm ci)
          (cd relayer && npm ci --omit=optional)
      - name: Run E2E
        run: bash scripts/e2e.sh

  live-portaldot:
    name: Live Portaldot V3 testnet (read-only)
    runs-on: ubuntu-latest
    continue-on-error: true # external network; informative, not blocking
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: |
          (cd contracts && forge install foundry-rs/forge-std@v1.17.0 --no-git && forge build)
          (cd sdk && npm ci)
          (cd scripts && npm ci)
      - name: Preflight (runtime facts, precompiles, asset precompiles)
        run: cd scripts && NETWORK=testnet node preflight.js
      - name: Native-account integration (dry-runs)
        run: |
          cd sdk && npx --yes tsx@4.19.1 test/portaldot_live.ts
          npx --yes tsx@4.19.1 test/crossvm_live.ts
      - name: Per-operation costs
        run: cd scripts && NETWORK=testnet node measure-costs.js
